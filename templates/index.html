<!doctype html>
<html>
  <head>
    <title>CareBot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0f172a;
      }
      .app {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      .sidebar {
        width: 280px;
        background: #131c2e;
        border-right: 1px solid #1e293b;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: margin-left 0.25s ease;
      }
      .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid #1e293b;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sidebar-header .icon {
        font-size: 22px;
      }
      .sidebar-header .title {
        color: white;
        font-weight: bold;
        font-size: 16px;
      }
      .sidebar-header .subtitle {
        color: #64748b;
        font-size: 11px;
      }

      .new-chat-btn {
        margin: 14px;
        padding: 10px;
        background: #0f766e;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      .new-chat-btn:hover {
        background: #0d9488;
      }

      .history-label {
        padding: 0 16px;
        color: #64748b;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 8px;
        margin-bottom: 6px;
      }

      .history-search {
        margin: 0 14px 10px 14px;
        padding: 8px 12px;
        border: 1px solid #1e293b;
        border-radius: 6px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 12px;
        outline: none;
      }
      .history-search::placeholder {
        color: #64748b;
      }
      .search-wrap {
  display: flex;
  gap: 6px;
 
}
.search-btn {
  background: #0f766e;
  border: none;
  border-radius: 6px;
  padding: 0 10px;
  cursor: pointer;
  font-size: 13px;
}
.search-btn:hover {
  background: #0d9488;
}
      .history-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px;
      }
      .history-item {
        background: #1e293b;
        color: #e2e8f0;
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        font-size: 13px;
      }
      .history-item:hover {
        background: #334155;
      }
      .history-item .time {
        color: #64748b;
        font-size: 10px;
        margin-bottom: 2px;
      }
      .no-history {
        color: #64748b;
        text-align: center;
        margin-top: 30px;
        font-size: 13px;
        padding: 0 10px;
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .chat-header {
        background: linear-gradient(135deg, #1e293b, #0f766e);
        color: white;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .menu-btn {
        display: none;
        background: transparent;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        margin-right: 4px;
      }
      .header-icon {
        width: 34px;
        height: 34px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .header-text .title {
        font-weight: bold;
        font-size: 15px;
      }
      .header-text .subtitle {
        font-size: 11px;
        color: #94a3b8;
      }
      .reset-btn {
        background: transparent;
        border: 1px solid #64748b;
        color: #cbd5e1;
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      .reset-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .disclaimer {
        font-size: 11px;
        color: #64748b;
        text-align: center;
        padding: 6px;
        background: #131c2e;
        border-bottom: 1px solid #1e293b;
      }

      .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }
      .message-row {
        display: flex;
        align-items: flex-end;
        margin: 10px 0;
        gap: 8px;
        max-width: 700px;
      }
      .message-row.user {
        flex-direction: row-reverse;
        margin-left: auto;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }
      .avatar.bot {
        background: #334155;
      }
      .avatar.user {
        background: #3b82f6;
      }

      .msg-col {
        display: flex;
        flex-direction: column;
        max-width: 100%;
      }
      .message-row.user .msg-col {
        align-items: flex-end;
      }
      .message {
        padding: 11px 15px;
        border-radius: 16px;
        line-height: 1.5;
        font-size: 14px;
        white-space: pre-line;
      }
      .bot-bubble {
        background: #1e293b;
        color: #e2e8f0;
        border-bottom-left-radius: 4px;
      }
      .user-bubble {
        background: #3b82f6;
        color: white;
        border-bottom-right-radius: 4px;
      }
      .msg-time {
        font-size: 10px;
        color: #64748b;
        margin-top: 3px;
        padding: 0 4px;
      }

      .typing-dots {
        display: flex;
        gap: 4px;
        padding: 12px 14px;
      }
      .typing-dots span {
        width: 6px;
        height: 6px;
        background: #94a3b8;
        border-radius: 50%;
        animation: bounce 1.2s infinite ease-in-out;
      }
      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      .input-area {
        display: flex;
        border-top: 1px solid #1e293b;
        padding: 14px 20px;
        background: #0f172a;
      }
      .input-area input {
        flex: 1;
        max-width: 700px;
        margin: 0 auto 0 0;
        padding: 13px 16px;
        border: none;
        outline: none;
        background: #131c2e;
        color: #e2e8f0;
        border-radius: 24px;
        font-size: 14px;
      }
      .input-area .send-wrap {
        max-width: 700px;
        width: 100%;
        display: flex;
        margin: 0 auto;
        gap: 10px;
      }
      .input-area input::placeholder {
        color: #64748b;
      }
      .input-area button.send-btn {
        background: #0f766e;
        color: white;
        border: none;
        padding: 0 22px;
        cursor: pointer;
        font-weight: 600;
        border-radius: 24px;
      }
      .input-area button.send-btn:disabled {
        background: #475569;
        cursor: not-allowed;
      }

      .overlay {
        display: none;
      }
      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          z-index: 20;
          margin-left: -280px;
        }
        .sidebar.open {
          margin-left: 0;
        }
        .menu-btn {
          display: inline-block;
        }
        .overlay {
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 15;
        }
        .overlay.show {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="icon">🩺</div>
          <div>
            <div class="title">CareBot</div>
            <div class="subtitle">AI Symptom Assistant</div>
          </div>
        </div>
        <button class="new-chat-btn" onclick="resetChat()">+ New Chat</button>
        <div class="history-label">History</div>
<div class="search-wrap">
  <input
    type="text"
    id="historySearch"
    class="history-search"
    placeholder="Search past conversations..."
    oninput="filterHistory()"
  />
  <button class="search-btn" onclick="filterHistory()">🔍</button>
</div>
<div class="history-scroll" id="historyList"></div>

      <div class="main">
        <div class="chat-header">
          <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="header-icon">🩺</div>
            <div class="header-text">
              <div class="title">CareBot</div>
              <div class="subtitle">AI Symptom Assistant</div>
            </div>
          </div>
          <button class="reset-btn" onclick="resetChat()">Reset</button>
        </div>
        <div class="disclaimer">
          Not a substitute for professional medical advice
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
          <div class="send-wrap">
            <input
              type="text"
              id="userInput"
              placeholder="Describe your symptoms..."
            />
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
              Send
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById("chatBox");
      const userInput = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const historyList = document.getElementById("historyList");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      let currentConversation = [];
      let allHistoryData = [];

      function currentTime() {
        return new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function toggleSidebar() {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");
      }
      function closeSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
      }

      function addMessage(text, sender, save = true) {
        const row = document.createElement("div");
        row.className = "message-row " + sender;

        const avatar = document.createElement("div");
        avatar.className = "avatar " + sender;
        avatar.innerText = sender === "bot" ? "🤖" : "🧑";

        const col = document.createElement("div");
        col.className = "msg-col";

        const msg = document.createElement("div");
        msg.className =
          "message " + (sender === "bot" ? "bot-bubble" : "user-bubble");
        msg.innerText = text;

        const time = document.createElement("div");
        time.className = "msg-time";
        time.innerText = currentTime();

        col.appendChild(msg);
        col.appendChild(time);
        row.appendChild(avatar);
        row.appendChild(col);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;

        if (save) currentConversation.push({ text, sender });
      }

      function showTypingIndicator() {
        const row = document.createElement("div");
        row.className = "message-row bot";
        row.id = "typingRow";

        const avatar = document.createElement("div");
        avatar.className = "avatar bot";
        avatar.innerText = "🤖";

        const dots = document.createElement("div");
        dots.className = "message bot-bubble typing-dots";
        dots.innerHTML = "<span></span><span></span><span></span>";

        row.appendChild(avatar);
        row.appendChild(dots);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      function removeTypingIndicator() {
        const row = document.getElementById("typingRow");
        if (row) row.remove();
      }

      function showWelcome() {
        chatBox.innerHTML = "";
        currentConversation = [];
        addMessage("Welcome! I'm CareBot. How can I help you today?", "bot");
      }

      window.onload = function () {
        showWelcome();
        renderHistoryList();
      };

      function saveCurrentConversationToHistory() {
        if (currentConversation.length > 1) {
          const allHistory = JSON.parse(
            localStorage.getItem("carebot_history") || "[]",
          );
          allHistory.unshift({
            timestamp: new Date().toLocaleString(),
            messages: currentConversation,
          });
          localStorage.setItem(
            "carebot_history",
            JSON.stringify(allHistory.slice(0, 20)),
          );
        }
      }

      async function resetChat() {
        saveCurrentConversationToHistory();
        await fetch("/reset", { method: "POST" });
        showWelcome();
        userInput.value = "";
        renderHistoryList();
        closeSidebar();
      }

      function renderHistoryList() {
        allHistoryData = JSON.parse(
          localStorage.getItem("carebot_history") || "[]",
        );
        const searchBox = document.getElementById("historySearch");
        if (searchBox) searchBox.value = "";
        renderHistoryItems(allHistoryData);
      }

      function renderHistoryItems(historyArray) {
        historyList.innerHTML = "";

        if (historyArray.length === 0) {
          historyList.innerHTML =
            '<div class="no-history">No conversations found</div>';
          return;
        }

        historyArray.forEach((convo) => {
          const item = document.createElement("div");
          item.className = "history-item";
          const preview = convo.messages.find((m) => m.sender === "user");
          item.innerHTML = `<div class="time">${convo.timestamp}</div><div>${preview ? preview.text : "Conversation"}</div>`;
          item.onclick = () => viewHistoryConversation(convo);
          historyList.appendChild(item);
        });
      }

      function filterHistory() {
        const query = document
          .getElementById("historySearch")
          .value.toLowerCase()
          .trim();

        if (query === "") {
          renderHistoryItems(allHistoryData);
          return;
        }

        const filtered = allHistoryData.filter((convo) =>
          convo.messages.some((m) => m.text.toLowerCase().includes(query)),
        );

        renderHistoryItems(filtered);
      }

      function viewHistoryConversation(convo) {
        chatBox.innerHTML = "";
        currentConversation = [];
        convo.messages.forEach((m) => addMessage(m.text, m.sender));
        closeSidebar();
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function sendMessage() {
        const text = userInput.value.trim();
        if (text === "") {
          addMessage("Please type your symptoms first.", "bot");
          return;
        }

        addMessage(text, "user");
        userInput.value = "";
        sendBtn.disabled = true;
        showTypingIndicator();

        try {
          const [response] = await Promise.all([
            fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: text }),
            }),
            wait(2000 + Math.random() * 1000),
          ]);

          if (!response.ok) throw new Error("Server error");
          const data = await response.json();

          removeTypingIndicator();
          addMessage(data.reply, "bot");
        } catch (error) {
          removeTypingIndicator();
          addMessage("Something went wrong. Please try again.", "bot");
        } finally {
          sendBtn.disabled = false;
        }
      }

      userInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
